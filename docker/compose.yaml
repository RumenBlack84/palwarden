#
# palwarden compose stack.
#
# Two modes, selected with COMPOSE_PROFILES (see .env.example):
#
#   Embedded (self-contained): run the Palworld server + tooling here.
#     COMPOSE_PROFILES=embedded docker compose up -d --build
#
#   External (manage an existing server): run only the tooling, pointed at your
#     existing box via PALWORLD_TARGET_HOST + ADMIN_PASSWORD.
#     COMPOSE_PROFILES=external docker compose up -d --build
#
# Build context is the repository root so the image can bake in the tooling.
name: palwarden

services:
  # Embedded: s6 supervises the Palworld server, the config web UI, and (when
  # ADMIN_PASSWORD is set) the telemetry sampler — all in one container.
  palwarden:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: palwarden:latest
    container_name: palwarden
    profiles: ["embedded"]
    # Pass .env straight through to the container as well as using it for
    # interpolation below. This is what makes open-ended settings work — notably
    # every PALWORLD_CFG_<KEY> applied to PalWorldSettings.ini, which compose
    # cannot enumerate here.
    env_file:
      - path: .env
        required: false
    environment:
      PALWARDEN_MODE: embedded
      UPDATE_ON_START: ${UPDATE_ON_START:-true}
      # Telemetry/management need the REST API admin password; setting it also
      # enables the server's REST API via PalWorldSettings.ini on boot.
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      DISCORD_WEBHOOK: ${DISCORD_WEBHOOK:-}
      PALWORLD_REST_PORT: ${PALWORLD_REST_PORT:-8212}
      FPS_SAMPLE_INTERVAL: ${FPS_SAMPLE_INTERVAL:-15}
      FPS_RETENTION_DAYS: ${FPS_RETENTION_DAYS:-7}
      MEMORY_THRESHOLD: ${MEMORY_THRESHOLD:-85}
      MEMORY_CHECK_INTERVAL: ${MEMORY_CHECK_INTERVAL:-300}
      MEMORY_WAIT: ${MEMORY_WAIT:-300}
      DAILY_REPORT_AT: ${DAILY_REPORT_AT:-09:00}
      # The schedule the Backups page writes, kept on the palwarden-state volume
      # rather than at the bare-metal default /etc/palworld/backup.env. /etc is in
      # the container's writable layer, which `docker compose up --force-recreate`
      # destroys — so on the old path an operator's saved retention policy reverted
      # to the 14-day default on the next recreate and the following --prune
      # deleted the history they had deliberately kept. Same volume as the job
      # queue and the telemetry DB, for the same reason. The bare-metal default is
      # unchanged: /etc/palworld is genuinely persistent on a real host.
      PALWORLD_BACKUP_SCHEDULE: /var/lib/palworld/backup.env
      # Scheduled world-save backups. These SEED the file above on the first start
      # only — the Backups page owns it afterwards (it is rewritten by
      # palwarden-jobd's backup_schedule_save), so re-rendering it on every `up`
      # would silently revert a retention policy set in the browser. Leave them
      # empty to take palworld-backups' own defaults (enabled, every 24h, 14 days,
      # keep 3).
      BACKUP_ENABLED: ${BACKUP_ENABLED:-}
      BACKUP_INTERVAL_HOURS: ${BACKUP_INTERVAL_HOURS:-}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-}
      BACKUP_KEEP_MIN: ${BACKUP_KEEP_MIN:-}
      # How often the tick *asks* whether a backup is due, not how often one is
      # taken. The interval above is what decides that, inside the tool.
      BACKUP_TICK_SECONDS: ${BACKUP_TICK_SECONDS:-900}
    ports:
      - "${PALWORLD_GAME_PORT:-8211}:8211/udp"
      - "127.0.0.1:${WEBUI_PORT:-8088}:8088"
      # REST API (8212) is deliberately NOT published to the host.
    volumes:
      - palworld-server:/opt/palworld/server
      - palworld-saved:/opt/palworld/server/Pal/Saved
      - palwarden-state:/var/lib/palworld
      # World-save archives, on their own volume and NOT inside palworld-saved:
      # the whole point of a backup is that it outlives the thing it backs up, and
      # anything left in the image's writable layer is destroyed by a plain
      # `docker compose up --force-recreate`. Docker seeds a fresh named volume
      # from the image path, which the Dockerfile pre-creates root-owned 0755 —
      # the ownership palworld-backup and palworld-restore both require — so this
      # never needs a runtime chown.
      - palwarden-backups:/opt/palworld/backups
      # The backups volume's two siblings under /opt/palworld, on volumes for the
      # same reason and not because /opt/palworld is persisted generally (it is
      # not — /opt/palworld/restore-scratch is transient by design and stays in the
      # writable layer). config-snapshots is rollback material: it is what an
      # operator reaches for after a bad config change, and a recreate is exactly
      # when they need it. config-backups holds palworld-engine-config's
      # pre-rollback copies, which the Engine editor's rollback list reads.
      # Ownership is seeded from the image path (root 0755 and steam 0755
      # respectively), so neither needs a runtime chown.
      - palwarden-config-snapshots:/opt/palworld/config-snapshots
      - palwarden-config-backups:/opt/palworld/config-backups
    stop_grace_period: 120s
    ulimits:
      nofile:
        soft: 100000
        hard: 100000
    restart: on-failure

  # External: the same image, tooling only, targeting an existing server.
  palwarden-external:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: palwarden:latest
    container_name: palwarden-external
    profiles: ["external"]
    env_file:
      - path: .env
        required: false
    environment:
      PALWARDEN_MODE: external
      # Required for external mode; validated by the entrypoint at start.
      PALWORLD_TARGET_HOST: ${PALWORLD_TARGET_HOST:-}
      PALWORLD_REST_PORT: ${PALWORLD_REST_PORT:-8212}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      DISCORD_WEBHOOK: ${DISCORD_WEBHOOK:-}
      FPS_SAMPLE_INTERVAL: ${FPS_SAMPLE_INTERVAL:-15}
      FPS_RETENTION_DAYS: ${FPS_RETENTION_DAYS:-7}
      DAILY_REPORT_AT: ${DAILY_REPORT_AT:-09:00}
      # On the state volume here too. External mode takes no world-save backups
      # (there is no local world), but the Backups page and its schedule form are
      # the same in both modes, so a schedule saved here must not evaporate on a
      # recreate either.
      PALWORLD_BACKUP_SCHEDULE: /var/lib/palworld/backup.env
    volumes:
      - palwarden-state:/var/lib/palworld
    restart: unless-stopped

volumes:
  palworld-server:
  palworld-saved:
  palwarden-state:
  palwarden-backups:
  palwarden-config-snapshots:
  palwarden-config-backups:
