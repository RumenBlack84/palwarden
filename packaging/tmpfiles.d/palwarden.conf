#
# Runtime directory tree for palwarden — the declarative version of
# install.sh steps 4c and 6, applied by the package postinstall and
# re-enforced by systemd-tmpfiles on every boot (self-healing ownership).
# tmpfiles.d(5). Comments explaining WHY each owner/mode is what it is live
# in install.sh; keep the two in sync.
#
# /opt/palworld itself MUST stay root-owned: palworld-restore's
# _refuse_writable_parents refuses every restore if any parent of
# restore-scratch is writable by a non-root account. Listed first so it is
# created before its children.
d /opt/palworld                  0755 root     root     -
d /opt/palworld/config-backups   0755 palworld palworld -
# Written only by root, listed by the unprivileged web UI (0755 suffices) —
# service-account ownership here was a rename-attack vector.
d /opt/palworld/backups          0755 root     root     -
d /opt/palworld/config-snapshots 0755 root     root     -
# Root-validated archive scratch; whole parent chain must be root-owned.
d /opt/palworld/restore-scratch  0700 root     root     -

d /var/lib/palworld              0755 palworld palworld -
d /var/log/palworld              0755 palworld palworld -
# Job queue + browser uploads: written by the unprivileged web UI, 0700
# because job files can carry config values. Root ownership here bricks the
# web UI (it cannot queue any action).
d /var/lib/palworld/jobs         0700 palworld palworld -
d /var/lib/palworld/uploads      0700 palworld palworld -

# Telemetry DB, pre-created service-account-owned: SQLite's WAL pragma makes
# every connect a write, so a root-owned DB breaks the web UI's read APIs.
# 'f' creates only if missing — an existing DB is live telemetry, never
# clobbered (that would be 'F').
f /var/lib/palworld/metrics.sqlite3 0644 palworld palworld -
