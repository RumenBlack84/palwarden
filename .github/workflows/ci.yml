name: CI

on:
  push:
  pull_request:

jobs:
  lint:
    name: Lint (shellcheck + python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # No shellcheck install: tests/lint.sh runs a pinned shellcheck image so
      # CI and local results cannot diverge on version.
      - name: Lint
        run: ./tests/lint.sh

  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run unit tests
        run: ./tests/run.sh

  integration:
    name: Integration tests (Docker)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # ubuntu-latest runners have Docker preinstalled. The integration suite
      # builds the image and runs container scenarios with dummy servers + a
      # fake SteamCMD — it does NOT download the real ~5GB game.
      - name: Run unit + integration tests
        run: ./tests/run.sh --integration
