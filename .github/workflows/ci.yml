name: CI

# push is scoped to master (not removed): PR branches get their run from the
# pull_request trigger alone — a bare `push:` made every PR branch run CI
# twice — while master keeps a post-merge run so the README badge stays live.
on:
  push:
    branches: [master]
  pull_request:

jobs:
  lint:
    name: Lint (shellcheck + python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # No shellcheck install: tests/lint.sh runs a pinned shellcheck image so
      # CI and local results cannot diverge on version.
      - name: Lint
        run: ./tests/lint.sh

  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # node is not optional in CI: test_webui_jobs.sh executes the web UI's own
      # collectSettings() under it, and fails rather than skips when it is
      # missing (see the $CI branch there). Pinned so a runner image change
      # cannot move it silently.
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Run unit tests
        run: ./tests/run.sh

  integration:
    name: Integration tests (Docker)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # --integration runs the unit suite too, so this job needs node for the
      # same reason the unit job does.
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      # ubuntu-latest runners have Docker preinstalled. The integration suite
      # builds the image and runs container scenarios with dummy servers + a
      # fake SteamCMD — it does NOT download the real ~5GB game.
      - name: Run unit + integration tests
        run: ./tests/run.sh --integration
