# Managed for the Yggdrasil Palworld server.
#
# Ubuntu's APT hook runs needrestart after unattended package upgrades.  The
# default Ubuntu mode can automatically restart affected services, which caused
# palworld.service to be restarted by a curl/libcurl update without using the
# Palworld REST API save/shutdown flow.
#
# Keep palworld.service visible in needrestart reports, but do not select it for
# automatic restart.  Palworld restarts should go through the dedicated graceful
# helpers: /usr/local/sbin/palworld-graceful-restart or palworld-update.
$nrconf{override_rc}->{qr(^palworld\.service$)} = 0;
