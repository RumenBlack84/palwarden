<style>
  /* Design tokens — the only place raw colors appear. Shared with future pages;
     see the design spec, "Component vocabulary". */
  * { box-sizing: border-box; }
  body { font: 14px/1.5 var(--pw-sans); margin: 0;
         background: var(--pw-bg); color: var(--pw-fg); }
  a { color: var(--pw-accent); }
  :focus-visible { outline: 2px solid var(--pw-accent); outline-offset: 2px; }


  .pw-page { padding: var(--pw-space-4); }

  /* pw-banner: the nameplate + vitals readout, the signature element. */
  .pw-banner { background: var(--pw-surface); border: 1px solid var(--pw-border);
               border-radius: 8px; padding: var(--pw-space-4); margin-bottom: var(--pw-space-4); }
  .pw-banner__name { display: flex; align-items: baseline; gap: var(--pw-space-3);
                      flex-wrap: wrap; }
  .pw-banner__name h1 { font-family: var(--pw-mono); font-size: 2.2rem; font-weight: 600;
                         margin: 0; letter-spacing: -.01em; }
  .pw-banner__meta { margin: var(--pw-space-2) 0 0; color: var(--pw-fg-muted);
                      font-size: .85rem; }
  .pw-banner__meta span { font-family: var(--pw-mono); }

  /* pw-vitals: four large-numeral readout cells. */
  .pw-vitals { display: grid; grid-template-columns: repeat(4, 1fr);
               gap: var(--pw-space-3); margin-top: var(--pw-space-4); }
  .pw-vitals__cell { border-top: 1px solid var(--pw-border); padding-top: var(--pw-space-2); }
  .pw-vitals__label { display: block; font-family: var(--pw-sans); font-size: .7rem;
                       text-transform: uppercase; letter-spacing: .12em;
                       color: var(--pw-fg-muted); margin-bottom: var(--pw-space-1); }
  .pw-vitals__value { display: block; font-family: var(--pw-mono); font-size: 2rem;
                       line-height: 1.1; }
  .pw-vitals__value--warn { color: var(--pw-warn); }
  .pw-vitals__value--bad { color: var(--pw-bad); }
  .pw-vitals__sub { display: block; font-family: var(--pw-mono); font-size: .78rem;
                    color: var(--pw-fg-muted); margin-top: var(--pw-space-1); }

  /* pw-pill: state badge. Always carries a text label — never color alone. */
  .pw-pill { display: inline-block; padding: 0 var(--pw-space-2); border-radius: 999px;
             font-family: var(--pw-mono); font-size: .82rem;
             border: 1px solid currentColor; }
  .pw-pill--ok { color: var(--pw-ok); } .pw-pill--warn { color: var(--pw-warn); }
  .pw-pill--bad { color: var(--pw-bad); } .pw-pill--idle { color: var(--pw-idle); }

  /* pw-grid: detail cards below the banner, with hierarchy via column span. */
  .pw-grid { display: grid; gap: var(--pw-space-3);
             grid-template-columns: repeat(6, 1fr); }
  /* Card visuals come from the shared .pw-section component (the editor's
     collapsible boxes); only the grid placement is this page's business. */
  .pw-card { grid-column: span 2; }
  .pw-card--wide { grid-column: span 3; }

  /* pw-stats: label/value grid. Labels are prose, values are monospace. */
  .pw-stats { display: grid; grid-template-columns: auto 1fr;
              gap: var(--pw-space-1) var(--pw-space-2); margin: 0; }
  .pw-stats dt { color: var(--pw-fg-muted); }
  .pw-stats dd { margin: 0; font-family: var(--pw-mono); }

  .pw-log { margin: 0; white-space: pre-wrap; word-break: break-word; max-height: 14rem;
            overflow: auto; font-family: var(--pw-mono); color: var(--pw-fg); }
  .pw-empty { color: var(--pw-fg-muted); font-style: italic; }

  @media (max-width: 900px) {
    .pw-vitals { grid-template-columns: repeat(2, 1fr); }
    .pw-grid { grid-template-columns: 1fr; }
    .pw-card, .pw-card--wide { grid-column: span 1; }
  }
  @media (max-width: 480px) {
    .pw-vitals { grid-template-columns: 1fr; }
    .pw-vitals__cell { border-top: none; border-left: 2px solid var(--pw-border);
                        padding-top: 0; padding-left: var(--pw-space-2); }
    .pw-banner__name h1 { font-size: 1.6rem; }
  }
  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; animation: none !important; }
  }
  .pw-pill, .pw-vitals__value { transition: color .15s ease; }
</style>

    <div class="pw-grid">

      <details class="pw-card pw-section pw-section--purple" open><summary class="pw-section__header"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M13 2 4.5 13.5H11L9.5 22 18 10.5h-6.5L13 2z"/></svg><h2>Engine.ini</h2></summary><div class="pw-section__content"><pre class="pw-log" id="engine" aria-live="polite">…</pre></div></details>

      <details class="pw-card pw-section pw-section--green" open><summary class="pw-section__header"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="9" y1="6" x2="20" y2="6"/><line x1="9" y1="12" x2="20" y2="12"/><line x1="9" y1="18" x2="20" y2="18"/><circle cx="5" cy="6" r="1"/><circle cx="5" cy="12" r="1"/><circle cx="5" cy="18" r="1"/></svg><h2>Jobs</h2></summary><div class="pw-section__content"><pre class="pw-log" id="jobs" aria-live="polite">…</pre></div></details>

<script>
// This dashboard is read-only: every fetch below is a GET, which needs nothing
// beyond the Basic auth the browser already performed for this page. Mutations
// are the Engine.ini editor's job, and so is the X-Palwarden-Token header they
// require — it holds the token in sessionStorage (per-tab, unreadable by any
// cross-origin page), which is why nothing here has to know about it.
async function get(path) {
  const res = await fetch(path, { headers: { "Accept": "application/json" } });
  if (!res.ok) throw new Error(path + " -> HTTP " + res.status);
  return res.json();
}

// Returns an error string when a payload is not usable, or null when it is.
// The API reports tool failures as HTTP 200 with {ok: false, error: "..."}
// so one broken tool doesn't blank the whole dashboard; callers must check
// this in addition to res.ok.
function payloadError(json) {
  if (json === null || typeof json === "undefined" || typeof json !== "object") {
    return "invalid response";
  }
  if (json.ok === false) {
    return json.error || "request failed";
  }
  return null;
}

// rows: [label, value, state?] where state is "ok" | "warn" | "bad" | "idle".
// A state renders the value as a pw-pill; the text is always present, so the
// meaning never depends on color alone.
function put(id, rows) {
  const dl = document.getElementById(id);
  dl.innerHTML = "";
  for (const [label, value, state] of rows) {
    const dt = document.createElement("dt"); dt.textContent = label;
    const dd = document.createElement("dd");
    if (state) {
      const pill = document.createElement("span");
      pill.className = "pw-pill pw-pill--" + state;
      pill.textContent = value;
      dd.append(pill);
    } else {
      dd.textContent = value;
    }
    dl.append(dt, dd);
  }
}

// empty=true marks the value as a pw-empty placeholder rather than real data.
function text(id, value, empty) {
  const el = document.getElementById(id);
  el.textContent = value;
  el.classList.toggle("pw-empty", !!empty);
}

// Renders a pw-stats region (a <dl>) as a single pw-empty placeholder row,
// used when a read failed (network error, non-2xx, or {ok: false}).
function putEmpty(id, message) {
  const dl = document.getElementById(id);
  dl.innerHTML = "";
  const dt = document.createElement("dt"); dt.textContent = "error";
  const dd = document.createElement("dd"); dd.className = "pw-empty"; dd.textContent = message;
  dl.append(dt, dd);
}

// Sets a vitals cell's large numeral, an optional muted sub-line, and an
// optional warn/bad color (text is always present regardless of color).
function vital(id, value, level, sub) {
  const el = document.getElementById("vital-" + id);
  el.textContent = value;
  el.classList.toggle("pw-vitals__value--warn", level === "warn");
  el.classList.toggle("pw-vitals__value--bad", level === "bad");
  const subEl = document.getElementById("vital-" + id + "-sub");
  if (subEl) subEl.textContent = sub || "";
}

async function refresh() {
  try {
    const h = await get("/api/health");
    const err = payloadError(h);
    if (err) throw new Error(err);
    const d = h.data || {};
    const svc = d.service || {};
    const api = (d.api && d.api.metrics) || {};
    const active = svc.active_state === "active";
    const pill = document.getElementById("server-pill");
    pill.className = "pw-pill pw-pill--" + (active ? "ok" : "bad");
    pill.textContent = active ? "RUNNING" : "STOPPED";
    document.getElementById("server-meta").textContent =
      "version " + (d.buildid || "unknown") + " · pid " + (svc.main_pid || "n/a");
    vital("players", (api.currentplayernum ?? "?") + "/" + (api.maxplayernum ?? "?"));
  } catch (e) {
    const pill = document.getElementById("server-pill");
    pill.className = "pw-pill pw-pill--idle";
    pill.textContent = "UNKNOWN";
    document.getElementById("server-meta").textContent = String(e && e.message || e);
    vital("players", "n/a");
  }

  try {
    const c = await get("/api/config");
    const err = payloadError(c);
    if (err) throw new Error(err);
    const d = c.data || {};
    document.getElementById("server-name").textContent = d.ServerName || "palwarden";
  } catch (e) { /* nameplate keeps its default; the error already surfaces above */ }

  try {
    const f = await get("/api/fps?window=24h");
    const err = payloadError(f);
    if (err) throw new Error(err);
    const w = ((f.data || {}).windows || {})["24h"] || {};
    put("fps", [
      ["avg (24h)", w.avg ?? "n/a"],
      ["1% low", w.low_1 ?? w["1%_low"] ?? "n/a"],
      ["samples", w.samples ?? "n/a"],
    ]);
    vital("fps", w.avg ?? "n/a");
  } catch (e) { putEmpty("fps", String(e && e.message || e)); vital("fps", "n/a"); }

  try {
    const s = await get("/api/service-events?since=24h");
    const err = payloadError(s);
    if (err) throw new Error(err);
    const d = s.data || s;
    put("events", [
      ["restarts (24h)", d.restarts ?? "n/a"],
      ["unexpected", d.unexpected ?? "n/a", (d.unexpected > 0) ? "warn" : "ok"],
      ["outages", d.outages ?? "n/a", (d.outages > 0) ? "warn" : "ok"],
    ]);
    const unexpected = d.unexpected > 0;
    vital("restarts", d.restarts ?? "n/a", unexpected ? "warn" : null,
          unexpected ? d.unexpected + " unexpected" : "");
  } catch (e) { putEmpty("events", String(e && e.message || e)); vital("restarts", "n/a"); }

  try {
    const e = await get("/api/engine");
    const err = payloadError(e);
    if (err) throw new Error(err);
    text("engine", (e.drift_ok ? "OK — " : "DRIFT — ") + (e.text || ""));
    vital("drift", e.drift_ok ? "OK" : "DRIFT", e.drift_ok ? null : "warn");
  } catch (e) { text("engine", String(e && e.message || e), true); vital("drift", "n/a"); }

  for (const [id, path] of [["backups", "/api/backups"], ["snapshots", "/api/snapshots"]]) {
    try {
      const r = await get(path);
      const err = payloadError(r);
      if (err) throw new Error(err);
      const list = r.data || [];
      if (list.length) text(id, list.map(x => x.name).join("\n"));
      else text(id, "No " + id + " yet — run palworld-" + id.replace(/s$/, ""), true);
    } catch (e) { text(id, String(e && e.message || e), true); }
  }
}

// --- job status (Task 6) ----------------------------------------------------
// The most recent job (list[0]; GET /api/jobs returns newest-first) is shown
// here so an operator who submitted a Save from the Engine.ini editor can see
// it land without switching tabs. This is a read: GET /api/jobs needs only the
// Basic auth this page already has, no X-Palwarden-Token.
const JOBS_UNFINISHED = ["queued", "running"];
const JOBS_POLL_INTERVAL_MS = 5000;
// Bounded so a dashboard left open is not polling forever if a job somehow
// never reaches a terminal state; ~10 minutes at 5 s. On expiry the region
// says so and stops, rather than either polling forever or silently going
// stale with no indication.
const JOBS_POLL_MAX_ATTEMPTS = 120;

function jobIsUnfinished(job) {
  return JOBS_UNFINISHED.indexOf(job && job.state) !== -1;
}

// Pure, so it can be exercised under node without a DOM. job.action, state,
// id and output are all server-supplied and output is straight from whatever
// tool the job ran (attacker-influenceable), so this only ever joins them
// into one plain string; the caller renders that string with textContent
// (see text()), never innerHTML.
function renderJobsText(list) {
  if (!list || !list.length) return { text: "No jobs yet", empty: true };
  const job = list[0];
  const tail = String(job.output || "").split("\n").slice(-20).join("\n");
  const lines = [
    (job.action || "unknown") + " — " + (job.state || "unknown"),
    "id " + (job.id || ""),
  ];
  if (tail) lines.push("", tail);
  return { text: lines.join("\n"), empty: false };
}

let jobsPollTimer = null;
async function pollJobs(attempt) {
  attempt = attempt || 0;
  try {
    const r = await get("/api/jobs");
    const err = payloadError(r);
    if (err) throw new Error(err);
    const list = r.data || [];
    const rendered = renderJobsText(list);
    text("jobs", rendered.text, rendered.empty);
    if (!list.some(jobIsUnfinished)) return; // every job terminal (or none): stop
    if (attempt + 1 >= JOBS_POLL_MAX_ATTEMPTS) {
      const minutes = Math.round(JOBS_POLL_MAX_ATTEMPTS * JOBS_POLL_INTERVAL_MS / 60000);
      text("jobs", rendered.text + "\n\n(stopped polling after " + minutes +
        " minutes; reload the page to resume)", false);
      return;
    }
    jobsPollTimer = setTimeout(function () { pollJobs(attempt + 1); }, JOBS_POLL_INTERVAL_MS);
  } catch (e) {
    text("jobs", String(e && e.message || e), true);
  }
}

refresh();
setInterval(refresh, 15000);
pollJobs();
</script>
